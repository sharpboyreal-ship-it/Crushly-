<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Matches | CRUSHLY</title>
<style>
:root{--pink:#ff397b;--purple:#762bdb;--bg:#fff7fa;--text:#292338}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:white;padding:17px 6%;display:flex;align-items:center;justify-content:space-between;gap:15px;box-shadow:0 2px 12px #0001}
.logo{font-size:27px;font-weight:900;color:var(--pink)}
nav{display:flex;gap:15px;flex-wrap:wrap}
nav a{color:#51485f;text-decoration:none;font-weight:bold;font-size:14px}
nav a:hover{color:var(--pink)}
main{max-width:1100px;margin:auto;padding:30px 20px}
.hero{padding:27px;background:linear-gradient(120deg,var(--pink),var(--purple));border-radius:20px;color:white;margin-bottom:25px}
.hero h1{margin:0 0 10px;font-size:32px}
.hero p{margin:0;line-height:1.6}
#status{padding:15px 0;color:#786b7b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 5px 22px #42213a0d}
.photo{width:100%;height:260px;object-fit:cover;display:block;background:#fce6ef}
.details{padding:17px}
.name{font-size:20px;margin:0 0 8px}
.meta{color:#786b7b;font-size:14px}
.button{display:block;text-align:center;padding:12px;margin-top:12px;background:var(--pink);color:white;text-decoration:none;font-weight:bold;border-radius:11px}
.secondary{background:#fce6ef;color:#b7225b}
.empty{background:white;padding:24px;border-radius:15px;line-height:1.7}
footer{text-align:center;color:#8a7c8c;padding:30px 15px;font-size:13px}
@media(max-width:550px){header{align-items:flex-start;flex-direction:column}main{padding:20px 13px}.hero h1{font-size:27px}.photo{height:290px}}
</style>
</head>
<body>
<header>
  <div class="logo">💗 CRUSHLY</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="discover.html">Discover</a>
    <a href="messages.html">Messages</a>
    <a href="profile.html">My Profile</a>
  </nav>
</header>

<main>
  <section class="hero">
    <h1>💕 Your Matches</h1>
    <p>When you and another member like each other, it's a match! Discover your mutual connections here.</p>
  </section>
  <p id="status">Checking your matches...</p>
  <section id="matches" class="grid"></section>
</main>

<footer>CRUSHLY © 2026 · Build connections with kindness.</footer>

<script type="module">
import { supabase } from './js/supabase.js';

const status = document.getElementById('status');
const grid = document.getElementById('matches');

function ageFromDate(value) {
  if (!value) return null;
  const birth = new Date(value + 'T00:00:00');
  if (Number.isNaN(birth.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  if (today.getMonth() < birth.getMonth() ||
      (today.getMonth() === birth.getMonth() &&
       today.getDate() < birth.getDate())) age--;
  return age >= 18 && age <= 120 ? age : null;
}

async function getPhoto(path) {
  const fallback = 'https://placehold.co/600x700/fce6ef/762bdb?text=CRUSHLY';
  if (!path) return fallback;
  if (/^https?:\/\//i.test(path)) return path;

  const { data, error } = await supabase.storage
    .from('profile-photos')
    .createSignedUrl(path, 3600);

  return error || !data?.signedUrl ? fallback : data.signedUrl;
}

function showEmpty(message) {
  grid.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'empty';
  box.textContent = message;
  grid.appendChild(box);
}

async function loadMatches() {
  status.textContent = 'Loading your matches...';
  grid.innerHTML = '';

  try {
    const { data: authData, error: authError } =
      await supabase.auth.getUser();

    if (authError) throw authError;

    if (!authData.user) {
      status.textContent = 'Please sign in to see your matches.';
      showEmpty('Sign in to your CRUSHLY account to see your matches.');
      const link = document.createElement('a');
      link.className = 'button';
      link.href = 'login.html';
      link.textContent = 'Sign in';
      grid.appendChild(link);
      return;
    }

    const userId = authData.user.id;

    const { data: sent, error: sentError } = await supabase
      .from('profile_likes')
      .select('liked_id')
      .eq('liker_id', userId);

    if (sentError) throw sentError;

    const { data: received, error: receivedError } = await supabase
      .from('profile_likes')
      .select('liker_id')
      .eq('liked_id', userId);

    if (receivedError) throw receivedError;

    const sentIds = new Set((sent || []).map(row => row.liked_id));
    const matchIds = [...new Set(
      (received || [])
        .map(row => row.liker_id)
        .filter(id => sentIds.has(id) && id !== userId)
    )];

    if (!matchIds.length) {
      status.textContent = 'No mutual matches yet.';
      showEmpty('💕 Your matches will appear here when you and another member like each other. Visit Discover to send some likes!');
      const link = document.createElement('a');
      link.className = 'button';
      link.href = 'discover.html';
      link.textContent = 'Discover members ❤️';
      grid.appendChild(link);
      return;
    }

    const { data: profiles, error: profilesError } = await supabase
      .from('profiles')
      .select('id,display_name,birth_date,location,bio,avatar_url')
      .in('id', matchIds);

    if (profilesError) throw profilesError;

    const eligible = (profiles || []).filter(p => ageFromDate(p.birth_date) !== null);

    for (const person of eligible) {
      const card = document.createElement('article');
      card.className = 'card';

      const img = document.createElement('img');
      img.className = 'photo';
      img.alt = 'Match profile photo';
      img.loading = 'lazy';
      img.src = await getPhoto(person.avatar_url);
      img.onerror = () => {
        img.onerror = null;
        img.src = 'https://placehold.co/600x700/fce6ef/762bdb?text=CRUSHLY';
      };
      card.appendChild(img);

      const details = document.createElement('div');
      details.className = 'details';

      const name = document.createElement('h2');
      name.className = 'name';
      name.textContent = '💕 ' + (person.display_name || 'CRUSHLY Member') +
        ', ' + ageFromDate(person.birth_date);
      details.appendChild(name);

      const location = document.createElement('p');
      location.className = 'meta';
      location.textContent = '📍 ' + (person.location || 'Location not provided');
      details.appendChild(location);

      const message = document.createElement('a');
      message.className = 'button';
      message.href = 'messages.html?recipient=' + encodeURIComponent(person.id);
      message.textContent = '💬 Message your match';
      details.appendChild(message);

      const view = document.createElement('a');
      view.className = 'button secondary';
      view.href = 'view-profile.html?id=' + encodeURIComponent(person.id);
      view.textContent = 'View full profile';
      details.appendChild(view);

      card.appendChild(details);
      grid.appendChild(card);
    }

    status.textContent = `${eligible.length} mutual match${eligible.length === 1 ? '' : 'es'} found! 💗`;

  } catch (error) {
    console.error(error);
    status.textContent = 'Could not load matches.';
    showEmpty('Please check your Supabase connection, table policies, and profile access permissions.');
  }
}

loadMatches();
</script>
</body>
</html>
