<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join CRUSHLY</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff1f7,#f1e8ff);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:#29172f}
.card{background:white;padding:35px;border-radius:24px;width:100%;max-width:430px;box-shadow:0 15px 50px #7928ca18}
.logo{text-align:center;color:#ff397b;font-size:30px;font-weight:900;margin-bottom:10px}
h1{text-align:center;font-size:27px}
.subtitle{text-align:center;color:#776a7c;margin-bottom:25px}
label{display:block;font-weight:bold;margin:15px 0 7px}
input{width:100%;padding:14px;border:1px solid #e4dce8;border-radius:10px;font-size:15px}
button{width:100%;border:0;background:linear-gradient(135deg,#ff397b,#7928ca);color:white;padding:15px;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:23px}
.note{font-size:12px;color:#776a7c;line-height:1.6;margin-top:15px}
a{color:#e52e70}
.back{text-align:center;margin-top:20px}
#message{margin-top:15px;line-height:1.5;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card">
<div class="logo">💗 CRUSHLY</div>
<h1>Create your account</h1>
<p class="subtitle">Your next connection starts here.</p>

<form id="signupForm">
<label for="email">Email address</label>
<input id="email" type="email" autocomplete="email" required>

<label for="password">Password</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required>

<label for="confirmPassword">Confirm password</label>
<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>

<label style="font-weight:normal">
<input id="adult" type="checkbox" required style="width:auto">
I confirm that I am 18 years or older.
</label>

<button type="submit" id="submitButton">Create Free Account</button>
<div id="message" role="status" aria-live="polite"></div>
</form>

<p class="note">Your account is free. Never share your password with anyone. By registering, you agree to our website terms and privacy policy.</p>
<div class="back"><a href="index.html">← Back to homepage</a></div>
<p class="back">Already registered? <a href="login.html">Log in</a></p>
</div>

<script type="module">
const form = document.getElementById("signupForm");
const message = document.getElementById("message");
const button = document.getElementById("submitButton");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmation = document.getElementById("confirmPassword").value;

  if (password !== confirmation) {
    message.textContent = "Your passwords do not match.";
    return;
  }

  message.textContent = "Connecting to CRUSHLY account services...";
  button.disabled = true;

  try {
    const { supabase } = await import("./js/supabase.js");

    const { data, error } = await supabase.auth.signUp({
      email,
      password
    });

    if (error) throw error;

    message.textContent = data.session
      ? "Account created! Redirecting..."
      : "Registration submitted! Check your email for a confirmation link.";

    if (data.session) {
      setTimeout(() => location.href = "dashboard.html", 1200);
    }
  } catch (error) {
    message.textContent = error.message === "Failed to fetch"
      ? "Cannot connect to account services. Check your Supabase configuration and internet connection."
      : error.message || "Registration failed. Please try again.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
